[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "tools/asset-converter"]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
[workspace.dependencies]
bevy = { version = "=0.18.1", default-features = false, features = ["std", "bevy_log", "reflect_auto_register", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_gltf", "gltf_animation", "bevy_pbr", "bevy_render", "bevy_scene", "bevy_window", "multi_threaded", "png", "tonemapping_luts", "ktx2", "zstd_rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.dev]
debug = 0
[profile.test]
debug = 0

[profile.release]
panic = "abort"
debug = 1
strip = false
